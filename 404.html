<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages 404.html fallback for SPA routing
      // Simple redirect to index.html - React Router will handle the rest
      var basePath = '/Musician-Website/';
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Always redirect to index.html
      window.location.replace(basePath + 'index.html' + search + hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/Musician-Website/index.html">
  </head>
  <body>
    <p>Redirecting to homepage...</p>
    <noscript>
      <p>Please enable JavaScript or <a href="/Musician-Website/">click here</a> to go to the homepage.</p>
    </noscript>
  </body>
</html>
